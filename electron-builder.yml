appId: net.ottomated.crewlink.beta
productName: Better-CrewLink
copyright: Copyright © 2021 OhMyGuus. Modified 2026 by Simon (window-hiding + local control bridge patch, GPLv3-compatible; full source published alongside this release).
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app

win:
  # zip alongside the default NSIS installer: the Simon's Among Us Launcher
  # installs this the same atomic way it installs Core -- download, verify,
  # extract files -- rather than executing a downloaded installer binary.
  target:
    - nsis
    - zip
  publish:
    - provider: github
      owner: simonpi3002-alt
      repo: bettercrewlink-hidden-fork
      # electron-builder's GitHub provider defaults releaseType to "draft",
      # which GitHub's /releases/latest API (what VoiceForkInstaller polls)
      # excludes entirely -- the Launcher would never see a new version.
      # "release" publishes it immediately so installs/updates are unattended.
      releaseType: release
linux:
  target:
    - "AppImage"
  publish:
    - provider: github
      owner: simonpi3002-alt
      repo: bettercrewlink-hidden-fork
      releaseType: release