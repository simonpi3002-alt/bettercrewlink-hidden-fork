name: Release

# Simon's Among Us fork: triggers on a pushed version tag (v*) so the
# Launcher's install/update flow has a predictable, repeatable release
# process to follow -- the same pattern already used for Core/ATR/BepInEx --
# in addition to the original manual workflow_dispatch trigger. Windows-only:
# this fork exists for the Simon's Among Us Launcher, which only targets
# Windows; the upstream Linux build target was dropped as unneeded CI cost,
# not because anything in the patch is Windows-specific.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # Pinned to the windows-2022 image, not windows-latest: windows-latest's
    # current image additionally carries a Visual Studio "18" (2026 preview)
    # install alongside VS2022, and node-gyp -- even at the 11.x version that
    # otherwise works on this runner family -- fails to parse that version
    # string ("unknown version \"undefined\"") and refuses to build native
    # modules at all. windows-2022 has a single, unambiguous VS2022 install.
    runs-on: windows-2022

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        # This project originally targeted Node 16.14.2. Bumped to 20 (LTS)
        # for the build toolchain only -- see the node-gyp step below for
        # why (current node-gyp's bundled undici needs both the
        # ReadableStream and File globals, added in Node 18 and 20
        # respectively). Electron 11's own runtime (what the shipped app
        # actually executes under) is unaffected; node-gyp cross-compiles
        # native modules against Electron's own ABI regardless of the Node
        # version running the build.
        uses: actions/setup-node@v3
        with:
          node-version: 20.18.1

      - name: Update node-gyp for the runner's Visual Studio version
        # The node-gyp bundled with npm doesn't recognize this runner's
        # installed Visual Studio version and fails every native module
        # build with "could not find a version of Visual Studio 2017 or
        # newer to use" even though a working toolchain is present. Pinned
        # to major version 11 deliberately, not "@latest": 8.x/10.x (the
        # bundled version, and this project's own dev-machine default) don't
        # recognize this VS version at all; 13.x's bundled `undici` needs
        # newer Node internals (markAsUncloneable) than even Node 20 LTS
        # ships. 11.x is the version that actually works against both this
        # runner's VS install and Node 20 LTS, found by testing the
        # available range end to end -- not a guess.
        shell: pwsh
        run: |
          npm install -g node-gyp@11
          # npm_config_node_gyp must point at the actual JS entry point --
          # `Get-Command node-gyp`'s .Source resolves to the PowerShell (.ps1)
          # shim on this runner, which node-gyp's callers invoke directly via
          # `node <path>`, not via pwsh, and fail with a syntax error trying
          # to parse PowerShell as JavaScript.
          $globalRoot = (npm root -g)
          $nodeGyp = Join-Path $globalRoot 'node-gyp\bin\node-gyp.js'
          echo "npm_config_node_gyp=$nodeGyp" >> $env:GITHUB_ENV

      - name: Patch child_process.execFile's default maxBuffer
        # node-gyp's own Visual Studio detection (execFile'ing a PowerShell
        # query against this runner's real, multi-instance VS install) can
        # exceed Node's default 1MB execFile maxBuffer, surfacing as
        # "RangeError [ERR_CHILD_PROCESS_STDIO_MAXBUFFER_EXCEEDED]" deep in
        # node-gyp's stack -- reproduced twice, not flaky. Rather than patch
        # node-gyp's own source (fragile across its version bumps), this
        # monkey-patches execFile process-wide to a much larger default
        # before anything else runs, via NODE_OPTIONS --require below.
        shell: pwsh
        run: |
          $shimPath = Join-Path $env:RUNNER_TEMP 'large-maxbuffer-shim.js'
          $shimLines = @(
            'const cp = require("child_process");',
            'const originalExecFile = cp.execFile;',
            'cp.execFile = function (file, args, options, callback) {',
            '  if (typeof options === "function") {',
            '    callback = options;',
            '    options = {};',
            '  }',
            '  options = Object.assign({ maxBuffer: 200 * 1024 * 1024 }, options || {});',
            '  return originalExecFile.call(this, file, args, options, callback);',
            '};'
          )
          Set-Content -Path $shimPath -Value $shimLines -Encoding UTF8
          # Forward slashes deliberately: NODE_OPTIONS's own tokenizer
          # treats backslashes inside a quoted value as escape characters
          # and strips them (confirmed: "D:\a\_temp\x.js" arrived at Node as
          # "D:a_tempx.js"). Windows and Node both accept forward slashes in
          # paths, so this sidesteps the parsing issue entirely.
          $shimPathForward = $shimPath -replace '\\', '/'
          echo "NODE_OPTIONS_MAXBUFFER_SHIM=--require `"$shimPathForward`"" >> $env:GITHUB_ENV

      - name: Install Dependencies
        # webpack 4's internal content-hashing still requests the "md4"
        # digest, which OpenSSL 3 (Node 17+) no longer supports by default.
        # --openssl-legacy-provider restores it. Safe here specifically
        # because this step runs under plain Node, never under Electron's
        # own runtime -- Electron rejects this flag in NODE_OPTIONS (a
        # security restriction on its bundled Node), but nothing in this
        # step or the next one actually launches the Electron app itself,
        # only tooling that builds it.
        #
        # npm_config_openssl_fips="" is required for memoryjs (0.0.6, a 2019
        # native module) to build at all: its binding.gyp evaluates
        # `openssl_fips != ""`, a variable current node-gyp/gyp no longer
        # auto-defines from Electron's headers ("name 'openssl_fips' is not
        # defined" while loading binding.gyp). node-gyp forwards npm_config_*
        # env vars straight through as gyp -D variables, so setting it here
        # (empty, matching what older toolchains defaulted it to) satisfies
        # the condition without touching memoryjs's own vendored source.
        shell: pwsh
        run: yarn install --cache-folder .yarn --network-timeout 100000
        env:
          NODE_OPTIONS: --openssl-legacy-provider ${{ env.NODE_OPTIONS_MAXBUFFER_SHIM }}
          npm_config_openssl_fips: ''

      - name: Build App
        run: yarn run publish
        env:
          NODE_OPTIONS: --openssl-legacy-provider ${{ env.NODE_OPTIONS_MAXBUFFER_SHIM }}
          # electron-builder rebuilds native modules again for the packaged
          # app's exact Electron ABI -- same openssl_fips gyp issue as the
          # Install Dependencies step above, so it's needed here too.
          npm_config_openssl_fips: ''
          # The repo-scoped, ephemeral token GitHub Actions provides
          # automatically -- no manually-created/stored PAT needed. Requires
          # the contents: write permission granted above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: BetterCrewLink Installer ${{ runner.os }}
          path: 'dist/Better-CrewLink Setup*.exe'
          if-no-files-found: error

      - name: Upload Unpacked 64bit
        uses: actions/upload-artifact@v4
        with:
          name: BetterCrewLink Unpacked 64bit
          path: 'dist/win-unpacked'

      - name: Upload Unpacked 32bit
        uses: actions/upload-artifact@v4
        with:
          name: BetterCrewLink Unpacked 32bit
          path: 'dist/win-ia32-unpacked'
